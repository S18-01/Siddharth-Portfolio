name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # every Monday, so new CVEs are caught even without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (static analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full git history
        run: gitleaks git --redact --verbose .

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm audit --audit-level=high

  headers:
    name: Live security headers
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed site sends every security header
        run: |
          h=$(curl -sSI https://siddharth-muragundla.vercel.app/)
          echo "$h"
          for k in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy cross-origin-opener-policy; do
            echo "$h" | grep -qi "^$k:" || { echo "::error::missing $k"; exit 1; }
          done
          if echo "$h" | grep -i '^content-security-policy:' | grep -o "script-src[^;]*" | grep -q unsafe-inline; then
            echo "::error::script-src allows unsafe-inline"; exit 1
          fi
